<body>
<header><div class="in">
 <div class="top"><h1>متابعة الحفظ</h1><div class="hb"><button class="pill" data-a="profiles" aria-label="تبديل المتعلم"><span aria-hidden="true">👤</span> <span id="hname"></span></button><button class="ghost ic" data-a="go" data-t="s" aria-label="الإعدادات">⚙</button></div></div>
 <p>حفظ ← تثبيت ← مراجعة ← ورد · <span id="hd"></span></p>
 <div class="st" id="hs"></div>
</div></header>
<noscript><p style="padding:16px">يحتاج التطبيق إلى تفعيل JavaScript.</p></noscript>
<main id="app"></main>
<button class="fab" data-a="openRec">＋ سجّل حفظي</button>
<nav id="nav" aria-label="التنقل الرئيسي"></nav>
<div id="toast" role="status" aria-live="polite"></div>

<dialog id="dg-rec" aria-labelledby="rf-title"></dialog>

<dialog id="dg-ask" aria-labelledby="ask-t"><form method="dialog" class="ask">
 <h3 id="ask-t"></h3><p id="ask-m"></p>
 <input id="ask-i" hidden aria-label="القيمة"><select id="ask-s" hidden aria-label="رقم الآية"></select>
 <div class="acts"><button id="ask-ok" value="ok">تأكيد</button><button id="ask-alt" value="alt" class="ghost" formnovalidate hidden></button><button id="ask-no" value="cancel" class="ghost" formnovalidate>إلغاء</button></div>
</form></dialog>

<dialog id="dg-prof" aria-labelledby="prof-t">
 <div class="sh-h"><h3 id="prof-t">المتعلمون</h3><button type="button" class="x" data-a="dgClose" aria-label="إغلاق">✕</button></div>
 <div class="sh-b"><div id="prof-b"></div><button class="big ghost" data-a="newP">＋ متعلم جديد</button></div>
</dialog>

<script src="app.js" defer></script>
